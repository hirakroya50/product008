name: Product 008 - Reviewed issue to draft PR
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to process
        required: true
        type: string
permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: product008-issue-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HARNESS_MODE: ${{ secrets.HARNESS_MODE || vars.HARNESS_MODE || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
      GH_TOKEN: ${{ github.token }}
      VALKEY_URL: ${{ secrets.VALKEY_URL }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify baseline before spending API repair budget
        run: |
          pnpm typecheck
          pnpm exec vitest run --maxWorkers=2
      - name: Require hosted Valkey configuration
        run: |
          if [[ -z "$VALKEY_URL" ]]; then
            echo 'Add VALKEY_URL in repository Actions secrets before running the issue pipeline.' >&2
            exit 1
          fi
      - name: Intake, triage, fit, develop, test, fix, commit and audit
        id: engine
        run: bash scripts/run-issue.sh "$ISSUE_NUMBER"
      - name: Publish draft PR for human review
        id: publish
        env:
          WORK_ID: ${{ steps.engine.outputs.work_id }}
        run: |
          pnpm harness publication-check --work "$WORK_ID"
          branch="$(git branch --show-current)"
          title="$(cat "work/$WORK_ID/pr-title.txt")"
          ahead="$(git rev-list --count "origin/$BASE_BRANCH..HEAD")"
          if [[ "$ahead" == 0 ]]; then
            echo 'Requested change is already present; no new PR required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --set-upstream origin "$branch"
          existing="$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "work/$WORK_ID/pr-summary.md"
            pr_url="$existing"
          else
            pr_url="$(gh pr create --draft --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file "work/$WORK_ID/pr-summary.md")"
          fi
          printf 'Draft PR awaiting human review: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          printf 'This pipeline verified the generated change; GITHUB_TOKEN-created PRs do not trigger PR quality automatically.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$pr_url" > "work/$WORK_ID/pr-url.txt"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Show investigation details on failure
        if: failure() && steps.engine.outputs.work_id != ''
        env:
          WORK_ID: ${{ steps.engine.outputs.work_id }}
        run: |
          if [[ -f "work/$WORK_ID/investigation.md" ]]; then
            cat "work/$WORK_ID/investigation.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "work/$WORK_ID/test-record.json" || -f "work/$WORK_ID/api-failure.json" ]]; then
            pnpm harness inspect --work "$WORK_ID"
          fi
      - name: Preserve work records, logs and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product008-issue-${{ github.event.issue.number || inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/
            docs/product-008/evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build published branch for S3
        if: steps.publish.outputs.branch != ''
        run: pnpm build
      - name: Preserve published branch production build
        if: steps.publish.outputs.branch != ''
        uses: actions/upload-artifact@v4
        with:
          name: issue-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  upload:
    needs: pipeline
    if: needs.pipeline.outputs.branch != ''
    uses: ./.github/workflows/s3-upload.yml
    with:
      branch: ${{ needs.pipeline.outputs.branch }}
      run_id: ${{ github.run_id }}
      artifact: issue-dist
    secrets: inherit
